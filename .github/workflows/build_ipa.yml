name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build App for iOS Device
        run: |
          PROJ_PATH=$(find . -name "NurIbadah.xcodeproj" -maxdepth 2 | head -n 1)
          echo "Found project at: $PROJ_PATH"
          
          xcodebuild clean build \
            -project "$PROJ_PATH" \
            -scheme NurIbadah \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$(pwd)/build"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r NurIbadah.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NurIbadah-IPA
          path: NurIbadah.ipa
          retention-days: 14
